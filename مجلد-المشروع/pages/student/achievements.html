.xp{background:linear-gradient(135deg,var(--pine),var(--pine-2));color:#fff;border-radius:28px;padding:22px}

.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.bd{text-align:center;padding:16px 8px;border-radius:20px;background:var(--surface);border:1px solid var(--line);transition:transform .3s var(--ease)}

.me{background:var(--mint);border-radius:16px;padding-inline:10px}
@media(min-width:700px){.badges{grid-template-columns:repeat(6,1fr)}}
